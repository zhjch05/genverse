[workspace]
members = ["crates/rules", "crates/net", "crates/server"]

[package]
name = "genverse"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
genverse_rules = { path = "crates/rules" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

# Live reload of `.vox.ron` models. Not available on Wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", features = ["file_watcher"] }
# Chat panel and local agent (Claude Code / Codex CLI) integration.
bevy_egui = "0.43"
egui-phosphor = "0.14"
# Local MCP server that gives agents read-only world tools.
tiny_http = "0.12"
# Joining a shared world.
genverse_net = { path = "crates/net", features = ["internet"] }
# Hosting a world from the game.
genverse_server = { path = "crates/server" }
serde_json = "1"
# Random player keys.
getrandom = "0.3"

# The physical sky needs compute shaders, which WebGL2 lacks.
[package.metadata.bevy_cli.web]
features = ["bevy/webgpu"]

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# World generation and meshing are hot loops; optimize them even in dev and web builds.
[profile.dev.package.genverse]
opt-level = 3

[profile.dev.package.genverse_rules]
opt-level = 3

[profile.dev.package.genverse_server]
opt-level = 3

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
