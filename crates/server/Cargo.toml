[package]
name = "genverse_server"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhjch05/genverse"
description = "A headless Genverse server: holds the world's change log, checks and orders every change, and shares it with everyone."

[[bin]]
name = "genverse-server"
path = "src/main.rs"

[dependencies]
genverse_rules = { path = "../rules" }
genverse_net = { path = "../net" }
serde_json = "1"
getrandom = "0.3"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[dev-dependencies]
# The internet test joins by invite, through iroh.
genverse_net = { path = "../net", features = ["internet"] }
