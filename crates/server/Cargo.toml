[package]
name = "cubewish_server"
version = "0.1.0"
edition = "2024"
description = "A headless Cubewish server: holds the world's change log, checks and orders every change, and shares it with everyone."

[[bin]]
name = "cubewish-server"
path = "src/main.rs"

[dependencies]
cubewish_rules = { path = "../rules" }
cubewish_net = { path = "../net" }
serde_json = "1"
getrandom = "0.3"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
