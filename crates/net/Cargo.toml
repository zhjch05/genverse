[package]
name = "genverse_net"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhjch05/genverse"
description = "Genverse's wire protocol: JSON messages, one per line, over TCP (bridged over iroh for the internet)."

[dependencies]
genverse_rules = { path = "../rules" }
if-addrs = "0.14"
iroh = { version = "1.4.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"], optional = true }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Messages are short-lived; boxing the big ones buys nothing.
large_enum_variant = "allow"

[features]
# Joining and hosting over the internet, through iroh (`internet.rs`).
internet = ["dep:iroh", "dep:tokio"]

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
