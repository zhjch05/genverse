[package]
name = "cubewish_net"
version = "0.1.0"
edition = "2024"
description = "Cubewish's wire protocol: JSON messages, one per line, over TCP."

[dependencies]
cubewish_rules = { path = "../rules" }
if-addrs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Messages are short-lived; boxing the big ones buys nothing.
large_enum_variant = "allow"
