[package]
name = "genverse_rules"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhjch05/genverse"
description = "Genverse's world rules: voxel models, terrain, terrain changes, build specs, game packages, and their limits. No rendering, so a server can share them."

[dependencies]
bevy_math = "0.20"
bevy_color = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ed25519-dalek = "2"
# Package hashes.
sha2 = "0.10"
# Checking packages' shaders, with the compiler the game draws them with.
naga = { version = "30", features = ["wgsl-in"] }

# Game scripts: sandboxed Luau. Not on the web yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "0.11", features = ["luau", "serialize"] }

[dev-dependencies]
# Parsing the `.vox.ron` models in tests, as the game does.
ron = "0.12"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
