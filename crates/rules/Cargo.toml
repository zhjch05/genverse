[package]
name = "genverse_rules"
version = "0.1.0"
edition = "2024"
description = "Genverse's world rules: voxel models, terrain, terrain changes, build specs, game packages, and their limits. No rendering, so a server can share them."

[dependencies]
bevy_math = "0.20"
bevy_color = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ed25519-dalek = "2"
# Package hashes.
sha2 = "0.10"

# Game scripts: sandboxed Luau. Not on the web yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "0.11", features = ["luau", "serialize"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
