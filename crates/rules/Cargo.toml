[package]
name = "cubelark_rules"
version = "0.1.0"
edition = "2024"
description = "Cubelark's world rules: voxel models, terrain, terrain changes, build specs, and their limits. No rendering, so a server can share them."

[dependencies]
bevy_math = "0.20"
bevy_color = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
